name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  CrossPlatform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 26.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - name: Run unit tests
      run: npm run mocha_test -- --grep "digging plugin death handler"

  Lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 26.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run lint
  
  PrepareSupportedVersions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 26.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    - id: set-matrix
      run: |
        node -e "
          const v = require('./lib/version').testedVersions;
          const groups = [];
          const SIZE = 4;
          for (let i = 0; i < v.length; i += SIZE) {
            groups.push({ versions: v.slice(i, i + SIZE).join(' ') });
          }
          console.log('matrix='+JSON.stringify({'include': groups}))
        " >> $GITHUB_OUTPUT

  MinecraftServer:
    needs: PrepareSupportedVersions
    runs-on: ubuntu-latest
    name: MC ${{ matrix.versions }}
    strategy:
      matrix: ${{ fromJson(needs.PrepareSupportedVersions.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          java-package: jre
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Start Tests
        run: |
          exit_code=0
          pids=""
          for v in ${{ matrix.versions }}; do
            npm run mocha_test -- --retries 3 -g "${v}v" > "test-${v}.log" 2>&1 &
            pids="$pids $!"
          done
          for pid in $pids; do
            wait $pid || exit_code=$?
          done
          # Print passing versions first, then failing versions last
          for v in ${{ matrix.versions }}; do
            if ! grep -q "failing" "test-${v}.log"; then
              echo ""
              echo "=========================================="
              echo "  Results for Minecraft ${v}"
              echo "=========================================="
              cat "test-${v}.log"
            fi
          done
          for v in ${{ matrix.versions }}; do
            if grep -q "failing" "test-${v}.log"; then
              echo ""
              echo "=========================================="
              echo "  FAILED: Minecraft ${v}"
              echo "=========================================="
              cat "test-${v}.log"
            fi
          done
          exit $exit_code
